# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: northstar-support
infra:
  provider: microsoft.foundry
requiredVersions:
  azd: ">=1.37.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.22"
services:
  northstar-support:
    name: northstar-support
    project: src/northstar_support
    host: azure.ai.agent
    kind: hosted
    language: python
    description: Fictional read-only returns support with policy grounding and deterministic eligibility.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      PYTHONNOUSERSITE: "1"
    protocols:
      - protocol: responses
        version: 2.0.0
    uses:
      - ai-project
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-4.1-mini
        model:
          format: OpenAI
          name: gpt-4.1-mini
          version: "2025-04-14"
        sku:
          name: GlobalStandard
          capacity: 10
