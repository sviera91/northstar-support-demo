name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2 ruff==0.14.2
      - name: Lint
        run: ruff check src/northstar_support/main.py src/northstar_support/returns.py tests
      - name: Deterministic business rules
        run: pytest -q
